apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pro16
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      terminationGracePeriodSeconds: 30   # SIGTERM -> SIGKILL
      containers:
        - name: worker
          image: localhost:5001/primes-worker:1.0
          envFrom:
            - configMapRef: { name: primes-config }
            - secretRef: { name: primes-secret }
          resources:
            requests: { cpu: 500m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
