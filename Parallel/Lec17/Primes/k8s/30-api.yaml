apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pro16
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: localhost:5001/primes-api:1.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: primes-config }
            - secretRef: { name: primes-secret }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          readinessProbe:      # готовий приймати запити?
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
          livenessProbe:       # процес не завис?
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:           # дати Service прибрати под
            preStop:
              sleep: { seconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pro16
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - port: 80               # порт служби в кластері
      targetPort: 8080       # порт контейнера
      nodePort: 30080        # порт на кожному вузлі
