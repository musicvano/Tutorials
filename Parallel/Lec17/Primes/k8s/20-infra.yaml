apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: pro16
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          envFrom:
            - secretRef: { name: primes-secret }
          ports: [{ containerPort: 5672 }]
          readinessProbe:      # порт AMQP приймає з’єднання
            tcpSocket: { port: 5672 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: pro16
spec:
  selector: { app: rabbitmq }
  ports: [{ port: 5672 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pro16
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:8.8
          ports: [{ containerPort: 6379 }]
          readinessProbe:      # Redis приймає з’єднання
            tcpSocket: { port: 6379 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pro16
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
